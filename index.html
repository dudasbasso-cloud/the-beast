<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>THE BEAST</title>
<style>
/* tabela ao estilo do Notion, clara ou escura conforme o telemóvel */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --t1: #37352f; --t2: #787774; --linha: #e9e9e7; --hover: #f7f7f5; --verde: #448361; --vermelho: #d44c47;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #191919; --t1: rgba(255,255,255,0.81); --t2: rgba(255,255,255,0.46); --linha: rgba(255,255,255,0.094); --hover: #202020; --verde: #529e72; --vermelho: #df5452; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--t1); font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
body { padding: max(28px, env(safe-area-inset-top)) 12px max(32px, env(safe-area-inset-bottom)); }
main { max-width: 760px; margin: 0 auto; }
h1 { font-size: 32px; line-height: 1.2; font-weight: 700; margin: 0 0 14px; }
.num { font-variant-numeric: tabular-nums; }
.verde { color: var(--verde); } .vermelho { color: var(--vermelho); } .cinza { color: var(--t2); }

/* propriedades da página */
.props { display: grid; grid-template-columns: 112px 1fr; row-gap: 4px; margin-bottom: 26px; }
.props div:nth-child(odd) { color: var(--t2); }

/* vistas */
.vistas { display: flex; gap: 2px; border-bottom: 1px solid var(--linha); margin-bottom: 0; }
.vistas button { background: none; border: 0; padding: 6px 8px 7px; font: 500 14px inherit; font-family: inherit; color: var(--t2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.vistas button[aria-selected="true"] { color: var(--t1); border-bottom-color: var(--t1); }

/* tabela */
.rolo { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
@media (max-width: 370px) { table { font-size: 12.5px; } }
th, td { border-bottom: 1px solid var(--linha); padding: 7px 5px; white-space: nowrap; }
th + th, td + td { border-left: 1px solid var(--linha); }
th { font-weight: 500; color: var(--t2); text-align: left; font-size: 13px; }
th .ic { font-size: 11px; margin-right: 4px; opacity: .7; }
td.n, th.n { text-align: right; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--bg); padding-left: 2px; }
tbody tr:hover td { background: var(--hover); }
tfoot td { color: var(--t2); font-size: 13px; border-bottom: 0; }
tfoot td b { color: var(--t1); font-weight: 500; }
.marca { color: var(--t2); font-size: 11px; vertical-align: super; margin-left: 1px; }
.nota { color: var(--t2); font-size: 12.5px; margin: 14px 0 0; }

/* cadeado */
#cadeado { min-height: 75vh; display: grid; place-items: center; }
#cadeado form { width: 100%; max-width: 300px; }
#cadeado input { width: 100%; font: 500 22px/1 inherit; font-family: inherit; letter-spacing: 8px; text-align: center; padding: 10px; margin: 10px 0;
  background: var(--bg); color: var(--t1); border: 1px solid var(--linha); border-radius: 6px; outline: none; }
#cadeado button { width: 100%; font: 500 14px inherit; font-family: inherit; padding: 9px; border-radius: 6px; border: 0; background: #2383e2; color: #fff; }
#erro { min-height: 20px; font-size: 13px; color: var(--vermelho); }
</style>
</head>
<body>
<main>
  <section id="cadeado">
    <form autocomplete="off">
      <h1>THE BEAST</h1>
      <div class="cinza">Código de 6 números</div>
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="Código">
      <div id="erro" role="alert"></div>
      <button type="submit">Abrir</button>
    </form>
  </section>
  <div id="app" hidden></div>
</main>

const GUARDA = 'diario-beast-codigo'
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']

function grupos(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') }
function eur(x, sinal = false) {
  const c = Math.round(Math.abs(x) * 100), zero = c === 0
  const s = zero ? '' : x < 0 ? '−' : (sinal ? '+' : '')
  return s + grupos(Math.floor(c / 100)) + ',' + String(c % 100).padStart(2, '0') + ' €'
}
const cor = x => Math.round(x * 100) > 0 ? 'verde' : Math.round(x * 100) < 0 ? 'vermelho' : 'cinza'
const dataPt = d => d.slice(8) + '/' + d.slice(5, 7) + (d.slice(0, 4) === String(new Date().getFullYear()) ? '' : '/' + d.slice(2, 4))
// euros sem cêntimos quando são redondos (depósitos de 100 €), com cêntimos quando não são
const eurA = (x, sinal) => Math.round(x * 100) % 100 ? eur(x, sinal) : eur(x, sinal).replace(',00 €', ' €')
const n = (x, sinal) => eurA(x, sinal).replace(' €', '')
const n2 = (x, sinal) => eur(x, sinal).replace(' €', '')   // lucro e saldo sempre com cêntimos
function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v)
  for (const f of filhos) if (f != null) e.append(f instanceof Node ? f : document.createTextNode(String(f)))
  return e
}

// abrir o cofre com o código
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
async function abrir(pin) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey'])
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(COFRE.salt), iterations: COFRE.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(COFRE.iv) }, k, b64(COFRE.ct))))
}
async function tentar(pin, guardar) {
  try { const d = await abrir(pin); if (guardar) localStorage.setItem(GUARDA, pin); mostrar(d); return true } catch (e) { return false }
}
const form = document.querySelector('#cadeado form'), campo = document.getElementById('pin'), erro = document.getElementById('erro')
form.addEventListener('submit', async ev => { ev.preventDefault(); erro.textContent = 'A abrir…'; if (!await tentar(campo.value.trim(), true)) { erro.textContent = 'Código errado'; campo.select() } })
campo.addEventListener('input', () => { if (campo.value.length === 6) form.requestSubmit() })
;(async () => { const g = localStorage.getItem(GUARDA); if (!(g && await tentar(g, false))) campo.focus() })()

function mostrar(D) {
  document.getElementById('cadeado').remove()
  const app = document.getElementById('app'); app.hidden = false
  const C = D.cartao, T = D.tot, g = new Date(D.gerado)
  const prop = (a, b) => [el('div', {}, a), el('div', { class: 'num' }, b)]
  app.append(el('h1', {}, 'THE BEAST'), el('div', { class: 'props' },
    ...prop('Conta', C.numero + ' · ' + C.plataforma + ' · ' + C.servidor),
    ...prop('Equilíbrio', eur(C.saldo)),
    ...prop('Créditos', eur(C.credito) + ' (bónus da VT)'),
    ...prop('Valores', 'em euros'),
    ...prop('Atualizado', g.getDate() + ' ' + MES3[g.getMonth()] + ' ' + g.getFullYear() + ', ' + String(g.getHours()).padStart(2, '0') + ':' + String(g.getMinutes()).padStart(2, '0'))))

  const vistas = el('div', { class: 'vistas', role: 'tablist' }), rolo = el('div', { class: 'rolo' }), nota = el('p', { class: 'nota' })
  app.append(vistas, rolo, nota)
  const V = { Dias: () => tabela(D.dias.filter(d => d.ops.length || d.dep || d.lev || d.tr || d.vt).reverse().map(d => ({ nome: dataPt(d.dia), dep: d.dep, lev: d.lev, tr: d.tr, pl: d.pl, vt: d.vt, saldo: d.fim, ops: d.ops.length })), 'Dia'),
              Meses: () => tabela(mesesComSaldo(D).reverse(), 'Mês') }
  for (const k of Object.keys(V)) {
    const b = el('button', { type: 'button', role: 'tab' }, k)
    b.addEventListener('click', () => { for (const x of vistas.children) x.setAttribute('aria-selected', String(x === b)); rolo.textContent = ''; rolo.append(V[k]()) })
    vistas.append(b)
  }
  vistas.firstChild.click()
  nota.append('O lucro é o das operações fechadas, já com os juros noturnos. Os depósitos e levantamentos incluem as ' + D.tot.nTr + ' transferências entre as tuas contas, a 10/07. ',
    el('span', { class: 'marca' }, '*'), ' Nesses dias um stop-out deixou a conta negativa e a VT pôs o saldo a zero (no total cobriu ' + eur(T.vt) + '). A última linha é o equilíbrio de hoje.')

  function mesesComSaldo(D) {
    const fim = new Map(); for (const d of D.dias) fim.set(d.dia.slice(0, 7), d.fim)
    return D.meses.map(m => ({ nome: MESES[+m.m.slice(5) - 1] + ' ' + m.m.slice(0, 4), dep: m.dep, lev: m.lev, tr: m.tr, pl: m.pl, vt: m.vt, saldo: fim.get(m.m), ops: m.ops }))
  }
  function tabela(linhas, primeira) {
    const th = (t, n, ic) => el('th', n ? { class: 'n' } : {}, ic ? el('span', { class: 'ic' }, ic) : null, t)
    const t = el('table', { class: 'num' }, el('thead', {}, el('tr', {},
      th(primeira, false, 'Aa'), th('Depósito', true), th('Saque', true), th('Lucro', true), th('Saldo', true))))
    const corpo = el('tbody'); t.append(corpo)
    let s = { dep: 0, lev: 0, pl: 0, ops: 0 }
    for (const l of linhas) {
      const dep = l.dep + Math.max(0, l.tr), lev = l.lev + Math.max(0, -l.tr)
      s.dep += dep; s.lev += lev; s.pl += l.pl; s.ops += l.ops
      corpo.append(el('tr', {},
        el('td', {}, l.nome),
        el('td', { class: 'n' }, dep ? n(dep) : ''),
        el('td', { class: 'n' }, lev ? n(lev) : ''),
        el('td', { class: 'n ' + cor(l.pl) }, l.ops ? n2(l.pl, true) : ''),
        el('td', { class: 'n' }, n2(l.saldo), l.vt ? el('span', { class: 'marca' }, '*') : null)))
    }
    t.append(el('tfoot', {}, el('tr', {},
      el('td', {}, 'Soma'),
      el('td', { class: 'n' }, el('b', {}, n(s.dep))),
      el('td', { class: 'n' }, el('b', {}, n(s.lev))),
      el('td', { class: 'n ' + cor(s.pl) }, n2(s.pl, true)),
      el('td', { class: 'n' }, el('b', {}, n2(D.tot.saldo))))))
    return t
  }
}
</script>
