<html lang="pt-PT">

<title>THE BEAST</title>
<style>
/* página ao estilo do Notion, com a letra e os acabamentos do iPhone; clara ou escura conforme o telemóvel */
:root {
  color-scheme: light dark;
  --bg: #ffffff; --t1: #37352f; --t2: #787774; --t3: #a5a29a; --linha: #ededeb; --forte: #e3e2de;
  --capa1: #e7f0e9; --capa2: #f6ead9;
  --callout: #f7f6f3;
  --pv-bg: #dbeddb; --pv-tx: #1c3829; --pr-bg: #ffe2dd; --pr-tx: #5d1715;
  --verde: #448361; --vermelho: #d44c47; --azul: #0a84ff;
  --mes1: #e3f2e7; --mes2: #f7f3ea; --mau1: #fbe9e6; --sombra: rgba(60,80,60,.10); --chip: rgba(255,255,255,.72);
  --ganho: #2f7a4f; --perda: #c4473f; --bar-g: #74c08e; --bar-p: #ea9a90; --base: rgba(55,53,47,.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191919; --t1: rgba(255,255,255,0.86); --t2: rgba(255,255,255,0.52); --t3: rgba(255,255,255,0.34); --linha: rgba(255,255,255,0.075); --forte: rgba(255,255,255,0.16);
    --capa1: #1f2d24; --capa2: #2e2619;
    --callout: #252525;
    --pv-bg: #2b593f; --pv-tx: #d6eadb; --pr-bg: #6e3630; --pr-tx: #f7d9d4;
    --verde: #529e72; --vermelho: #df5452;
    --mes1: #1e3426; --mes2: #232322; --mau1: #3a2421; --sombra: rgba(0,0,0,.35); --chip: rgba(255,255,255,.07);
    --ganho: #8fd6a6; --perda: #f0a89e; --bar-g: #6fc28c; --bar-p: #e98f84; --base: rgba(255,255,255,.18);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--t1); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: max(36px, env(safe-area-inset-bottom)); }
.num { font-variant-numeric: tabular-nums; }

/* capa e ícone, como uma página do Notion */
.capa { height: 132px; background: linear-gradient(120deg, var(--capa1), var(--capa2)); }
.pagina { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.icone { font-size: 64px; line-height: 1; margin-top: -38px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.12)); }
h1 { font: 800 34px/1.15 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; letter-spacing: -0.02em; margin: 10px 0 14px; }

/* propriedades */
.props { margin: 0 0 18px; }
.prop { display: grid; grid-template-columns: 26px 104px 1fr; align-items: baseline; padding: 4px 0; font-size: 14.5px; }
.prop .e { font-size: 15px; }
.prop .k { color: var(--t2); }
.prop .v b { font-weight: 700; }

/* cartão do mês */
.mes { position: relative; overflow: hidden; border-radius: 18px; padding: 14px 16px 10px; margin: 0 0 22px;
  background: linear-gradient(150deg, var(--mes1), var(--mes2)); border: 1px solid var(--linha); }
.mes.mau { background: linear-gradient(150deg, var(--mau1), var(--mes2)); }
.mes .topo { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--t2); }
.mes .topo .em { font-size: 15px; margin-right: 5px; }
.mes .valor { font: 800 34px/1.05 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; letter-spacing: -0.025em; margin: 6px 0 4px; color: var(--ganho); }
.mes .resumo { font-size: 13px; color: var(--t2); }
.mes .resumo b { color: var(--t1); font-weight: 700; }
.mes.mau .valor { color: var(--perda); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 999px; background: var(--chip); font-size: 12.5px; color: var(--t2); white-space: nowrap; }
.chip b { color: var(--t1); font-weight: 750; }
.barras { margin: 12px -2px 0; touch-action: pan-y; }
.barras svg { display: block; width: 100%; overflow: visible; }
.legenda { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--t2); margin-top: 8px; min-height: 18px; }
.legenda b { color: var(--t1); font-weight: 700; }

/* vistas */
.vistas { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); }
.vistas button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 8px 10px 9px; margin-bottom: -1px;
  font: 600 14.5px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--t2); border-bottom: 2px solid transparent; cursor: pointer; }
.vistas button[aria-selected="true"] { color: var(--t1); border-bottom-color: var(--t1); }

/* tabela */
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--bg); text-align: right; padding: 10px 5px 8px; border-bottom: 1px solid var(--linha);
  font-size: 12.5px; font-weight: 600; color: var(--t3); }
thead th:first-child { text-align: left; padding-left: 2px; }
td { padding: 11px 5px; border-bottom: 1px solid var(--linha); text-align: right; white-space: nowrap; vertical-align: middle; }
td:first-child { text-align: left; padding-left: 2px; }
td.dia { font-weight: 650; }
td.dia .st { display: inline-block; width: 21px; font-size: 13.5px; }
td.vazio, span.vazio { color: var(--t3); }
td.mov { color: var(--t2); }
td.saldo { font-weight: 600; }
.pill { display: inline-block; padding: 2px 6px; border-radius: 6px; font-weight: 700; }
.pill.g { background: var(--pv-bg); color: var(--pv-tx); }
.pill.p { background: var(--pr-bg); color: var(--pr-tx); }
.vt { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--t2); }
tfoot td { border-bottom: 0; border-top: 2px solid var(--forte); padding-top: 12px; font-weight: 750; }
tfoot td:first-child { color: var(--t2); font-weight: 600; }
@media (max-width: 420px) { td, thead th { padding-left: 4px; padding-right: 4px; } .pill { padding: 2px 5px; } }
@media (max-width: 400px) { table { font-size: 12.5px; } td, thead th { padding-left: 3px; padding-right: 3px; } td.dia .st { width: 18px; } .pill { padding: 2px 4px; } }
.nota { color: var(--t2); font-size: 12.5px; line-height: 1.55; margin: 16px 0 0; }
.contas { background: var(--callout); border-radius: 14px; padding: 13px 14px 12px; margin: 18px 0 0; font-size: 14px; }
.contas .tit { font-weight: 700; margin-bottom: 6px; }
.contas .l { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 3px 0; }
.contas .l > span:first-child { color: var(--t2); }
.contas .l > span:last-child { font-weight: 600; white-space: nowrap; }
.contas .e { display: inline-block; width: 24px; }
.contas .soma { border-top: 1px solid var(--forte); margin-top: 5px; padding-top: 8px; }
.contas .soma > span { color: var(--t1) !important; font-weight: 750 !important; }
.contas .ganho { margin-top: 10px; }
.contas .ganho > span:first-child { color: var(--t1); font-weight: 650; }
.contas .ganho > span:last-child { color: var(--ganho); font-weight: 800; font-size: 15px; }
.contas .cap { color: var(--t2); font-size: 12.5px; margin: 1px 0 0 24px; }

/* cadeado */
#cadeado { min-height: 88vh; display: grid; place-items: center; padding: 0 24px; }
#cadeado form { width: 100%; max-width: 320px; text-align: center; }
#cadeado .icone { margin: 0 0 6px; }
#cadeado h1 { margin: 6px 0 4px; }
#cadeado .sub { color: var(--t2); font-size: 15px; }
#cadeado input { width: 100%; margin: 22px 0 10px; padding: 14px 10px 14px 22px; font: 700 26px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: 12px; text-align: center;
  background: var(--callout); color: var(--t1); border: 0; border-radius: 14px; outline: none; }
#cadeado button { width: 100%; padding: 15px; border: 0; border-radius: 14px; background: var(--azul); color: #fff; font: 600 17px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
#erro { min-height: 22px; font-size: 14px; color: var(--vermelho); }
</style>
</head>
<body>
<section id="cadeado">
  <form autocomplete="off">
    <div class="icone">🐂</div>
    <h1>THE BEAST</h1>
    <div class="sub">Escreve o código de 4 números</div>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="Código">
    <div id="erro" role="alert"></div>
    <button type="submit">Abrir</button>
  </form>
</section>
<div id="app" hidden></div>

const GUARDA = 'diario-beast-codigo'
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']

function grupos(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') }
function eur(x, sinal = false, simbolo = true) {
  const c = Math.round(Math.abs(x) * 100), zero = c === 0
  const s = zero ? '' : x < 0 ? '−' : (sinal ? '+' : '')
  return s + grupos(Math.floor(c / 100)) + ',' + String(c % 100).padStart(2, '0') + (simbolo ? ' €' : '')
}
const redondo = x => Math.round(x * 100) % 100 === 0
const curto = x => redondo(x) ? grupos(Math.round(Math.abs(x))) : eur(x, false, false)   // depósitos e saques: 450, 8.300, 1.043,84
const sinal = x => Math.round(x * 100) > 0 ? 1 : Math.round(x * 100) < 0 ? -1 : 0
const diaPt = d => +d.slice(8) + ' ' + MES3[+d.slice(5, 7) - 1]
function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : e.setAttribute(k, v)
  for (const f of filhos) if (f != null && f !== false) e.append(f instanceof Node ? f : document.createTextNode(String(f)))
  return e
}

// abrir o cofre com o código
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
async function abrir(pin) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey'])
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(COFRE.salt), iterations: COFRE.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(COFRE.iv) }, k, b64(COFRE.ct))))
}
async function tentar(pin, guardar) {
  try { const d = await abrir(pin); if (guardar) localStorage.setItem(GUARDA, pin); mostrar(d); return true } catch (e) { return false }
}
const form = document.querySelector('#cadeado form'), campo = document.getElementById('pin'), erro = document.getElementById('erro')
form.addEventListener('submit', async ev => { ev.preventDefault(); erro.textContent = 'A abrir…'; if (!await tentar(campo.value.trim(), true)) { erro.textContent = 'Código errado'; campo.select() } })
campo.addEventListener('input', () => { if (campo.value.length === 4) form.requestSubmit() })
;(async () => { const g = localStorage.getItem(GUARDA); if (!(g && await tentar(g, false))) campo.focus() })()

function mostrar(D) {
  document.getElementById('cadeado').remove()
  const app = document.getElementById('app'); app.hidden = false
  const C = D.cartao, T = D.tot, g = new Date(D.gerado)
  const pag = el('div', { class: 'pagina' })
  app.append(el('div', { class: 'capa' }), pag)

  const prop = (e, k, ...v) => el('div', { class: 'prop' }, el('span', { class: 'e' }, e), el('span', { class: 'k' }, k), el('span', { class: 'v num' }, ...v))
  pag.append(el('div', { class: 'icone' }, '🐂'), el('h1', {}, 'THE BEAST'), el('div', { class: 'props' },
    prop('🏦', 'Conta', C.numero + ' · ' + C.plataforma),
    prop('💶', 'Equilíbrio', el('b', {}, eur(C.saldo))),
    prop('🎁', 'Créditos', eur(C.credito) + ' · bónus da VT'),
    prop('🕒', 'Atualizado', g.getDate() + ' ' + MES3[g.getMonth()] + ', ' + String(g.getHours()).padStart(2, '0') + ':' + String(g.getMinutes()).padStart(2, '0'))))

  // cartão do mês: o valor, os dias e uma barra por dia (toca numa para a ver)
  const m = D.meses.at(-1), dm = D.dias.filter(d => d.dia.startsWith(m.m) && d.ops.length)
  const ganhos = dm.filter(d => sinal(d.pl) > 0).length, perdas = dm.filter(d => sinal(d.pl) < 0).length
  const bom = sinal(m.pl) >= 0
  const chip = (e, n, t) => el('span', { class: 'chip' }, e, el('b', {}, n), t)
  const legenda = el('div', { class: 'legenda num' }), barras = el('div', { class: 'barras' })
  pag.append(el('section', { class: 'mes' + (bom ? '' : ' mau') },
    el('div', { class: 'topo' }, el('span', {}, el('span', { class: 'em' }, bom ? '🔥' : '🧊'), MESES[+m.m.slice(5) - 1] + ' ' + m.m.slice(0, 4)), el('span', {}, dm.length + ' dias')),
    el('div', { class: 'valor num' }, eur(m.pl, true)),
    el('div', { class: 'resumo' }, '✅ ', el('b', {}, ganhos), ' a ganhar  ·  ❌ ', el('b', {}, perdas), ' a perder  ·  ', el('b', {}, grupos(m.ops)), ' operações'),
    barras, legenda))
  barrasDoMes(barras, legenda, dm)

  const vistas = el('div', { class: 'vistas', role: 'tablist' }), lugar = el('div'), nota = el('p', { class: 'nota' })
  pag.append(vistas, lugar, contas(), nota)
  const V = {
    dias: ['📅', 'Dias', () => tabela(D.dias.filter(d => d.ops.length || d.dep || d.lev || d.tr || d.vt).reverse()
      .map(d => ({ nome: diaPt(d.dia), dep: d.dep, lev: d.lev, tr: d.tr, pl: d.pl, vt: d.vt, saldo: d.fim, ops: d.ops.length })), 'Dia')],
    meses: ['🗓️', 'Meses', () => tabela(mesesComSaldo().reverse(), 'Mês')],
  }
  for (const [k, [e, n, f]] of Object.entries(V)) {
    const b = el('button', { type: 'button', role: 'tab' }, e, n)
    b.addEventListener('click', () => { for (const x of vistas.children) x.setAttribute('aria-selected', String(x === b)); lugar.textContent = ''; lugar.append(f()) })
    vistas.append(b)
  }
  vistas.firstChild.click()
  nota.append('✅ dia a ganhar · ❌ dia a perder · 💰 só houve depósito · 🔁 foi para a tua outra conta · 🛟 a VT pôs o saldo a zero depois de um stop-out, pago com o bónus de 20% que dá em cada depósito (enquanto há bónus, o saldo pode ficar negativo). ' +
    'O lucro é o das operações fechadas, já com os juros noturnos. Depósitos e saques como no portal da VT, à hora de Lisboa. Cada linha soma: saldo de antes + depósito − saque − 🔁 + lucro + 🛟 = saldo.')

  // de onde vem o saldo, parcela a parcela, e quanto ganhou no total
  function contas() {
    const l = (e, k, v, cls) => el('div', { class: 'l' + (cls ? ' ' + cls : '') }, el('span', {}, el('span', { class: 'e' }, e), k), el('span', {}, v))
    const saiu = T.levantado + T.transfSaida - T.transfEntrada
    return el('section', { class: 'contas num' }, el('div', { class: 'tit' }, '🧮 Como se chega aos ' + eur(T.saldo)),
      l('💰', 'Depositaste', eur(T.depositado)),
      l('🏧', 'Sacaste', eur(-T.levantado)),
      l('🔁', 'Para a tua outra conta', eur(T.transfEntrada - T.transfSaida)),
      l('📈', 'Lucro das operações', eur(T.plOps, true)),
      l('🛟', 'Bónus da VT nos stop-outs', eur(T.vt, true)),
      l('💶', 'Saldo', eur(T.saldo), 'soma'),
      l('🏆', 'Ganhaste no total', eur(T.resultado, true), 'ganho'),
      el('div', { class: 'cap' }, 'Saíram ' + eur(saiu) + ' e ainda lá estão ' + eur(T.saldo) + '. Puseste ' + eur(T.depositado) + '.'))
  }

  function barrasDoMes(box, legenda, dias) {
    const W = Math.max(240, box.clientWidth), H = 46, base = 2, topo = 2
    const max = Math.max(...dias.map(d => Math.max(0, d.pl))), min = Math.min(...dias.map(d => Math.min(0, d.pl)))
    const alto = H - base - topo, y0 = topo + alto * (max / ((max - min) || 1))
    const banda = W / dias.length, bw = Math.min(24, banda - 6)
    const NS = 'http://www.w3.org/2000/svg', sv = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e }
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Lucro de cada dia do mês' })
    svg.append(sv('line', { x1: 0, x2: W, y1: y0, y2: y0, stroke: 'var(--base)', 'stroke-width': 1 }))
    const mostra = d => {
      legenda.textContent = ''
      legenda.append(el('span', {}, el('b', {}, diaPt(d.dia)), ' · ' + d.ops.length + ' operações'), el('b', { style: 'color:var(' + (d.pl >= 0 ? '--ganho' : '--perda') + ')' }, eur(d.pl, true)))
    }
    const marcas = dias.map((d, i) => {
      const cx = banda * (i + .5), h = Math.max(3, Math.abs(d.pl) / ((max - min) || 1) * alto), sobe = d.pl >= 0
      const y1 = sobe ? y0 - h : y0 + h, x0 = cx - bw / 2, x1 = cx + bw / 2, r = Math.min(4, h, bw / 2)
      const caminho = sobe
        ? `M${x0} ${y0} L${x0} ${y1 + r} Q${x0} ${y1} ${x0 + r} ${y1} L${x1 - r} ${y1} Q${x1} ${y1} ${x1} ${y1 + r} L${x1} ${y0} Z`
        : `M${x0} ${y0} L${x0} ${y1 - r} Q${x0} ${y1} ${x0 + r} ${y1} L${x1 - r} ${y1} Q${x1} ${y1} ${x1} ${y1 - r} L${x1} ${y0} Z`
      const barra = sv('path', { d: caminho, fill: sobe ? 'var(--bar-g)' : 'var(--bar-p)' })
      const alvo = sv('rect', { x: banda * i, y: 0, width: banda, height: H, fill: 'transparent', tabindex: 0 })
      const escolhe = () => { for (const [b] of marcas) b.setAttribute('opacity', .4); barra.setAttribute('opacity', 1); mostra(d) }
      alvo.addEventListener('pointerdown', escolhe); alvo.addEventListener('pointerenter', escolhe); alvo.addEventListener('focus', escolhe)
      svg.append(barra, alvo)
      return [barra, d]
    })
    svg.addEventListener('pointerleave', () => { for (const [b] of marcas) b.setAttribute('opacity', 1); mostraMelhor() })
    box.append(svg)
    const mostraMelhor = () => { const d = dias.reduce((a, x) => x.pl > a.pl ? x : a, dias[0]); legenda.textContent = ''; legenda.append(el('span', {}, '🏆 Melhor dia: ', el('b', {}, diaPt(d.dia))), el('b', { style: 'color:var(--ganho)' }, eur(d.pl, true))) }
    mostraMelhor()
  }
  function mesesComSaldo() {
    const fim = new Map(); for (const d of D.dias) fim.set(d.dia.slice(0, 7), d.fim)
    return D.meses.map(x => ({ nome: MES3[+x.m.slice(5) - 1] + ' ' + x.m.slice(2, 4), dep: x.dep, lev: x.lev, tr: x.tr, pl: x.pl, vt: x.vt, saldo: fim.get(x.m), ops: x.ops }))
  }
  function tabela(linhas, primeira) {
    const t = el('table', { class: 'num' }, el('thead', {}, el('tr', {},
      el('th', {}, primeira), el('th', {}, 'Depósito'), el('th', {}, 'Saque'), el('th', {}, 'Lucro'), el('th', {}, 'Saldo'))))
    const corpo = el('tbody'); t.append(corpo)
    const s = { dep: 0, lev: 0, pl: 0 }
    const sub = (e, txt) => el('span', { class: 'vt' }, e + ' ' + txt)
    for (const l of linhas) {
      const sp = sinal(l.pl)
      s.dep += l.dep; s.lev += l.lev; s.pl += l.pl
      corpo.append(el('tr', {},
        el('td', { class: 'dia' }, el('span', { class: 'st' }, l.ops ? (sp > 0 ? '✅' : sp < 0 ? '❌' : '➖') : '💰'), l.nome),
        el('td', { class: l.dep ? 'mov' : 'vazio' }, l.dep ? curto(l.dep) : '·', l.tr > 0 ? sub('🔁', curto(l.tr)) : null),
        el('td', { class: l.lev ? 'mov' : 'vazio' }, l.lev ? curto(l.lev) : '·', l.tr < 0 ? sub('🔁', curto(-l.tr)) : null),
        el('td', {}, l.ops ? el('span', { class: 'pill ' + (sp >= 0 ? 'g' : 'p') }, eur(l.pl, true, false)) : el('span', { class: 'vazio' }, '·')),
        el('td', { class: 'saldo' }, eur(l.saldo, false, false), l.vt ? sub('🛟', eur(l.vt, false, false)) : null)))
    }
    const sp = sinal(s.pl)
    t.append(el('tfoot', {}, el('tr', {},
      el('td', {}, 'Total'),
      el('td', {}, curto(s.dep)),
      el('td', {}, curto(s.lev)),
      el('td', {}, el('span', { class: 'pill ' + (sp >= 0 ? 'g' : 'p') }, eur(s.pl, true, false))),
      el('td', {}, eur(T.saldo, false, false)))))
    return t
  }
}
